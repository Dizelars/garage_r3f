<html lang="ru">
  <head>
    <meta http-equiv="encoding" content="utf-8" charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Model Viewer Example">

    <meta name="robots" content="noindex,nofollow,noarchive">

    <link rel="apple-touch-icon" sizes="180x180" href="https://garage-codd.ru/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://garage-codd.ru/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://garage-codd.ru/favicons/favicon-16x16.png">
    <link rel="manifest" href="https://garage-codd.ru/favicons/site.webmanifest">
    <link rel="mask-icon" href="https://garage-codd.ru/favicons/safari-pinned-tab.svg" color="#5bbad5">
    <style>
      
      
      
      
      
      
      
      
      

      * {
          -webkit-box-sizing: border-box;
                  box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: white;
        background-color: black;
      }

      .google_viewer {
          display: none;
      }

      .link_to_page {
        width: -webkit-fit-content;
        width: -moz-fit-content;
        width: fit-content;
        position: absolute;
        left: 50%;
        top: 20px;
        -webkit-transform: translateX(-50%);
            -ms-transform: translateX(-50%);
                transform: translateX(-50%);
        z-index: 2;
      }

      .link_to_page a {
        padding: 14px 12px;
        width: -webkit-max-content;
        width: -moz-max-content;
        width: max-content;
        border: 1px solid #FFFFFF;
        color: #FFFFFF;
        border-radius: 10px;
        font-family: 'MoscowSans', sans-serif;
        font-weight: 300;
        font-size: 16px;
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-pack: justify;
            -ms-flex-pack: justify;
                justify-content: space-between;
        -webkit-box-align: center;
            -ms-flex-align: center;
                align-items: center;
        cursor: pointer;
        text-decoration: none;
      }

      .link_to_page a:hover {
          background-color: #313131;
      }

      .AR_loading {
        position: absolute;
        z-index: 2;
        -webkit-box-sizing: border-box;
                box-sizing: border-box;
        top: 88px;
        left: 50%;
        -webkit-transform: translateX(-50%);
            -ms-transform: translateX(-50%);
                transform: translateX(-50%);
        width: 100%;
        padding: 0 10px;
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-pack: center;
            -ms-flex-pack: center;
                justify-content: center;
        -webkit-box-align: center;
            -ms-flex-align: center;
                align-items: center;
      }

      .AR_loading.AR_opened {
        display: none;
      }

      .AR_loading .AR_loading_wrapper {
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-pack: center;
            -ms-flex-pack: center;
                justify-content: center;
        -webkit-box-align: center;
            -ms-flex-align: center;
                align-items: center;
        min-height: 130px;
        padding: 20px;
        gap: 10px;
        max-width: 400px;
        border-radius: 12px;
        background: #1C1C1C;
      }

      .AR_loading .text {
        font-family: 'MoscowSans', sans-serif;
        font-weight: 500;
        font-size: 16px;
        text-align: center;
        margin: 0;
        color: #ffffff;
      }

      .model_picture {
        position: absolute;
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        bottom: 0;
        left: 50%;
        -webkit-transform: translateX(-50%);
            -ms-transform: translateX(-50%);
                transform: translateX(-50%);
        width: 100%;
        max-width: 600px;
        max-height: 600px;
        pointer-events: none;
        overflow: hidden;
      }

      .model_picture img {
        width: 100%;
        height: 100%;
        -o-object-fit: cover;
            object-fit: cover;
      }

      .model_picture .gradient {
        background: -webkit-gradient(linear, left top, left bottom, color-stop(70%, rgba(0, 0, 0, 0.00)), to(#000)), transparent 50% / cover no-repeat;
        background: -o-linear-gradient(top, rgba(0, 0, 0, 0.00) 70%, #000 100%), transparent 50% / cover no-repeat;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.00) 70%, #000 100%), transparent 50% / cover no-repeat;
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100%;
      }

      .model_picture .gradient_left {
        left: 0;
        -webkit-transform: rotate(90deg);
            -ms-transform: rotate(90deg);
                transform: rotate(90deg);
      }

      .model_picture .gradient_right {
        right: 0;
        -webkit-transform: rotate(270deg);
            -ms-transform: rotate(270deg);
                transform: rotate(270deg);
      }

      @media (max-width: 375px) {
        .AR_loading .AR_loading_wrapper {
          padding: 5px;
          gap: 5px;
        }

        .AR_loading .AR_loading_wrapper .lottie {
          width: 100px !important;
          height: 100px !important;
        }

        .AR_loading .text {
          font-size: 14px;
        }
      }
    </style>
    <title>AR</title>

    <div id="root"></div>
